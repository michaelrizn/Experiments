<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Рельеф Мандельброта</title>
  <style>
    :root { color-scheme: dark; background: #000; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #000; }
    main { min-height: calc(100dvh - 64px); display: grid; place-items: center; padding: 12px; overflow: hidden; }
    .canvas-frame { width: min(100%, 1180px); aspect-ratio: 16 / 10; }
    canvas { display: block; width: 100%; height: 100%; background: #000; touch-action: manipulation; }
  </style>
  <script src="../assets/toolbar.js" defer></script>
</head>
<body data-title="Рельеф Мандельброта" data-back="../">
  <main>
    <div class="canvas-frame">
      <canvas id="sketch" aria-label="Анимированный рельеф множества Мандельброта"></canvas>
    </div>
  </main>
  <script>
    // Геометрия, камера и шаг времени повторяют исходный Processing-скетч.
    const canvas = document.querySelector("#sketch");
    const context = canvas.getContext("2d", { alpha: false });
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    const sceneSize = 800;
    const halfSize = sceneSize / 2;
    const maxIterations = 400;
    const focal = halfSize / Math.tan(Math.PI / 6);
    const eye = { x: 400, y: 400, z: 400 };
    const camera = {
      right: { x: Math.SQRT1_2, y: -Math.SQRT1_2, z: 0 },
      up: { x: 1 / Math.sqrt(6), y: 1 / Math.sqrt(6), z: -2 / Math.sqrt(6) },
      forward: { x: -1 / Math.sqrt(3), y: -1 / Math.sqrt(3), z: -1 / Math.sqrt(3) },
    };

    let pixelRatio = 1;
    let width = 1;
    let height = 1;
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let points = [];
    let k = 0;
    let paused = reducedMotion.matches;

    function iterationsAt(x, y) {
      let real = 0;
      let imaginary = 0;
      let iteration = 0;
      while (real * real + imaginary * imaginary < 4 && iteration < maxIterations) {
        const next = real * real - imaginary * imaginary + x / halfSize - 1;
        imaginary = 2 * real * imaginary + y / halfSize;
        real = next;
        iteration += 1;
      }
      return iteration;
    }

    function buildPoints() {
      // Плотная сетка сохраняет непрерывный рельеф, но остаётся отзывчивой на мобильных.
      const density = Math.max(360, Math.min(440, Math.round(Math.sqrt(width * height) / 1.75)));
      const step = sceneSize / density;
      points = [];

      for (let row = 0; row < density; row += 1) {
        const y = -halfSize + row * step;
        for (let column = 0; column < density; column += 1) {
          const x = -halfSize + column * step;
          points.push({ x, y, n: iterationsAt(x, y) });
        }
      }
    }

    function resize() {
      const bounds = canvas.getBoundingClientRect();
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = Math.max(1, Math.round(bounds.width));
      height = Math.max(1, Math.round(bounds.height));
      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);

      const padding = Math.max(12, Math.min(width, height) * .035);
      scale = Math.min((width - padding * 2) / sceneSize, (height - padding * 2) / sceneSize);
      offsetX = (width - sceneSize * scale) * .5;
      offsetY = (height - sceneSize * scale) * .5;
      buildPoints();
    }

    function draw() {
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      context.fillStyle = "#000";
      context.fillRect(0, 0, width, height);

      const pointSize = Math.max(.75, Math.min(1.1, Math.min(width, height) / 680));

      for (const point of points) {
        const z = -point.n * k;
        const dx = point.x - eye.x;
        const dy = point.y - eye.y;
        const dz = z - eye.z;
        const depth = dx * camera.forward.x + dy * camera.forward.y + dz * camera.forward.z;
        if (depth <= 4) continue;

        const sourceX = halfSize + focal * (dx * camera.right.x + dy * camera.right.y) / depth;
        const sourceY = halfSize - focal * (dx * camera.up.x + dy * camera.up.y + dz * camera.up.z) / depth;
        const tone = Math.min(255, point.n);
        if (tone < 8) continue;

        context.fillStyle = `rgb(${tone} ${tone} ${tone})`;
        context.fillRect(offsetX + sourceX * scale, offsetY + sourceY * scale, pointSize, pointSize);
      }
    }

    function frame() {
      if (!paused) k += .01;
      draw();
      requestAnimationFrame(frame);
    }

    canvas.tabIndex = 0;
    canvas.addEventListener("click", () => { paused = !paused; });
    canvas.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        paused = !paused;
      }
    });
    reducedMotion.addEventListener("change", event => { paused = event.matches; });
    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", resize);

    resize();
    frame();
  </script>
</body>
</html>
