<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Рельеф Мандельброта</title>
  <style>
    :root { color-scheme: dark; background: #000; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #000; }
    main { min-height: calc(100dvh - 64px); padding: 12px; overflow: hidden; }
    .canvas-frame { width: min(100%, 1180px); aspect-ratio: 16 / 10; }
    canvas { display: block; width: 100%; height: 100%; background: #000; touch-action: manipulation; }
  </style>
  <script src="../assets/toolbar.js" defer></script>
</head>
<body data-title="Рельеф Мандельброта" data-back="../">
  <main>
    <div class="canvas-frame">
      <canvas id="sketch" aria-label="Анимированный рельеф множества Мандельброта"></canvas>
    </div>
  </main>
  <script>
    // Ортографическая изометрия сохраняет исходный разворот, но исключает перспективное схлопывание.
    const canvas = document.querySelector("#sketch");
    const context = canvas.getContext("2d", { alpha: false });
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const maxIterations = 400;
    const maxRelief = 1.15;
    const frameInterval = 1000 / 30;
    let width = 1;
    let height = 1;
    let pixelRatio = 1;
    let sceneScale = 1;
    let points = [];
    let startedAt = performance.now();
    let paused = reducedMotion.matches;
    let pausedAt = 0;
    let lastFrameAt = 0;

    function iterationsAt(x, y) {
      let real = 0;
      let imaginary = 0;
      let iteration = 0;

      while (real * real + imaginary * imaginary < 4 && iteration < maxIterations) {
        const next = real * real - imaginary * imaginary + x / 400 - 1;
        imaginary = 2 * real * imaginary + y / 400;
        real = next;
        iteration += 1;
      }

      return iteration;
    }

    function buildPoints() {
      const density = Math.max(170, Math.min(240, Math.round(Math.sqrt(width * height) / 2.7)));
      const step = 800 / density;
      const nextPoints = [];

      for (let row = 0; row < density; row += 1) {
        const y = -400 + row * step;
        for (let column = 0; column < density; column += 1) {
          const x = -400 + column * step;
          const iteration = iterationsAt(x, y);
          if (iteration > 6) {
            nextPoints.push({
              x,
              y,
              iteration,
              tone: Math.min(255, iteration),
            });
          }
        }
      }

      // Точки рисуются от дальней части поверхности к ближней, как при глубинной отрисовке.
      nextPoints.sort((left, right) => left.x + left.y - right.x - right.y);
      points = nextPoints;
    }

    function resize() {
      const bounds = canvas.getBoundingClientRect();
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = Math.max(1, Math.round(bounds.width));
      height = Math.max(1, Math.round(bounds.height));
      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

      // Это точные максимальные границы изометрической проекции при любой фазе анимации.
      const projectedWidth = 800 * 1.41421356;
      const projectedHeight = 800 * .81649658 + maxIterations * maxRelief * .81649658;
      const padding = Math.max(14, Math.min(width, height) * .045);
      sceneScale = Math.min((width - padding * 2) / projectedWidth, (height - padding * 2) / projectedHeight);
      buildPoints();
    }

    function currentRelief() {
      if (paused) return pausedAt;
      const elapsed = (performance.now() - startedAt) / 1000;
      // Высота плавно и циклично меняется, вместо бесконечного роста исходного k.
      return maxRelief * (0.5 - 0.5 * Math.cos(elapsed * .36));
    }

    function paint(now) {
      requestAnimationFrame(paint);
      if (now - lastFrameAt < frameInterval) return;
      lastFrameAt = now;

      const relief = currentRelief();
      context.fillStyle = "#000";
      context.fillRect(0, 0, width, height);
      const dotSize = Math.max(.8, Math.min(1.35, Math.min(width, height) / 620));

      for (const point of points) {
        const projectedX = (point.x - point.y) * .70710678;
        const projectedY = (point.x + point.y + point.iteration * relief * 2) * .40824829 - 188;
        const x = width * .5 + projectedX * sceneScale;
        const y = height * .5 + projectedY * sceneScale;
        context.fillStyle = `rgb(${point.tone}, ${point.tone}, ${point.tone})`;
        context.fillRect(x, y, dotSize, dotSize);
      }
    }

    function togglePause() {
      if (paused) {
        const phase = Math.acos(Math.max(-1, Math.min(1, 1 - pausedAt / maxRelief * 2)));
        startedAt = performance.now() - phase / .36 * 1000;
        paused = false;
      } else {
        pausedAt = currentRelief();
        paused = true;
      }
    }

    canvas.tabIndex = 0;
    canvas.addEventListener("click", togglePause);
    canvas.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        togglePause();
      }
    });
    reducedMotion.addEventListener("change", event => {
      if (event.matches && !paused) {
        pausedAt = currentRelief();
        paused = true;
      } else if (!event.matches && paused) {
        togglePause();
      }
    });
    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", resize);

    resize();
    requestAnimationFrame(paint);
  </script>
</body>
</html>
