<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Рельеф Мандельброта</title>
  <style>
    :root { color-scheme: dark; background: #000; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #000; }
    main { min-height: calc(100dvh - 64px); display: grid; place-items: center; padding: 12px; overflow: hidden; }
    .canvas-frame { width: min(100%, 1100px); aspect-ratio: 16 / 10; }
    canvas { display: block; width: 100%; height: 100%; background: #000; touch-action: manipulation; }
  </style>
  <script src="../assets/toolbar.js" defer></script>
</head>
<body data-title="Рельеф Мандельброта" data-back="../">
  <main>
    <div class="canvas-frame">
      <canvas id="sketch" aria-label="Анимированный рельеф множества Мандельброта"></canvas>
    </div>
  </main>
  <script>
    // Исходный скетч: float r,i,t,x,y,n,d=400,k=0;void setup(){size(800,800,P3D);}void draw(){background(-1);camera(d,d,d,0,0,0,0,0,-1);for(x=-d;x<d;x++)for(y=-d;y<d;y++){r=i=n=0;while((r*r+i*i<4)&&n<d){t=r*r-i*i+x/d-1;i=2*r*i+y/d;r=t;n++;}stroke(n);point(x,y,-n*k);}k+=.01;}
    const canvas = document.querySelector("#sketch");
    const ctx = canvas.getContext("2d", { alpha: false });
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const maximumIterations = 110;
    let pixelRatio = 1;
    let viewWidth = 1;
    let viewHeight = 1;
    let terrain = [];
    let phase = 0;
    let paused = reducedMotion.matches;

    function iterationsAt(real, imaginary) {
      let realPart = 0;
      let imaginaryPart = 0;
      let iteration = 0;
      while (realPart * realPart + imaginaryPart * imaginaryPart < 4 && iteration < maximumIterations) {
        const next = realPart * realPart - imaginaryPart * imaginaryPart + real;
        imaginaryPart = 2 * realPart * imaginaryPart + imaginary;
        realPart = next;
        iteration += 1;
      }
      return iteration;
    }

    function buildTerrain() {
      const columns = Math.max(150, Math.min(260, Math.round(viewWidth / 4.3)));
      const rows = Math.max(88, Math.min(155, Math.round(viewHeight / 4.2)));
      terrain = [];

      for (let row = 0; row < rows; row += 1) {
        const imaginary = row / (rows - 1) * 2.6 - 1.3;
        for (let column = 0; column < columns; column += 1) {
          const real = column / (columns - 1) * 3.15 - 2.25;
          const iteration = iterationsAt(real, imaginary);
          terrain.push({
            column: column / (columns - 1) - .5,
            row: row / (rows - 1) - .5,
            height: iteration / maximumIterations,
            visible: iteration < maximumIterations,
            brightness: Math.min(255, 150 + iteration * 1.1),
          });
        }
      }
    }

    function setResolution() {
      const bounds = canvas.getBoundingClientRect();
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      viewWidth = Math.max(1, Math.round(bounds.width));
      viewHeight = Math.max(1, Math.round(bounds.height));
      canvas.width = Math.round(viewWidth * pixelRatio);
      canvas.height = Math.round(viewHeight * pixelRatio);
      buildTerrain();
    }

    function draw() {
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, viewWidth, viewHeight);

      const unit = Math.min(viewWidth / 16, viewHeight / 10);
      const centerX = viewWidth * .51;
      const horizonY = viewHeight * .68;
      const yaw = -.16 + Math.sin(phase) * .08;
      const pointSize = Math.max(.65, Math.min(1.2, unit / 48));

      for (const point of terrain) {
        if (!point.visible) continue;
        const shiftedX = point.column * Math.cos(yaw) - point.row * Math.sin(yaw);
        const shiftedZ = point.column * Math.sin(yaw) + point.row * Math.cos(yaw);
        const screenX = centerX + (shiftedX * 13.4 + shiftedZ * 3.8) * unit;
        const screenY = horizonY + (shiftedZ * 3.35 - point.height * 5.4) * unit;
        if (screenX < 0 || screenX > viewWidth || screenY < 0 || screenY > viewHeight) continue;
        const distanceFade = .58 + (point.row + .5) * .42;
        const tone = Math.round(point.brightness * distanceFade);
        ctx.fillStyle = `rgb(${tone} ${tone} ${tone})`;
        ctx.fillRect(screenX, screenY, pointSize, pointSize);
      }
    }

    function frame() {
      if (!paused) phase += .006;
      draw();
      requestAnimationFrame(frame);
    }

    canvas.addEventListener("click", () => { paused = !paused; });
    canvas.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        paused = !paused;
      }
    });
    reducedMotion.addEventListener("change", event => { paused = event.matches; });
    canvas.tabIndex = 0;
    canvas.setAttribute("aria-label", "Анимированный рельеф множества Мандельброта. Нажмите, чтобы остановить или запустить.");
    setResolution();
    window.addEventListener("resize", setResolution);
    window.addEventListener("orientationchange", setResolution);
    frame();
  </script>
</body>
</html>
