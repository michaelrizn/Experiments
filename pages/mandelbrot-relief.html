<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Рельеф Мандельброта</title>
  <style>
    :root { color-scheme: dark; background: #000; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #000; }
    main { min-height: calc(100dvh - 64px); padding: 12px; overflow: hidden; }
    .canvas-frame { width: min(100%, 1180px); aspect-ratio: 16 / 10; }
    canvas { display: block; width: 100%; height: 100%; background: #000; touch-action: manipulation; }
  </style>
  <script src="../assets/toolbar.js" defer></script>
</head>
<body data-title="Рельеф Мандельброта" data-back="../">
  <main>
    <div class="canvas-frame">
      <canvas id="sketch" aria-label="Анимированный рельеф множества Мандельброта"></canvas>
    </div>
  </main>
  <script>
    // Геометрия, камера и шаг времени повторяют исходный Processing-скетч.
    const canvas = document.querySelector("#sketch");
    const gl = canvas.getContext("webgl", { alpha: false, antialias: false, depth: true });
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    const sceneSize = 800;
    const halfSize = sceneSize / 2;
    const maxIterations = 400;
    let pixelRatio = 1;
    let width = 1;
    let height = 1;
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let k = 0;
    let paused = reducedMotion.matches;
    let vertexBuffer;
    let pointCount = 0;
    let pointData;
    let depthMin = 0;
    let depthMax = 1;

    const vertexSource = `
      attribute vec3 aPoint;
      uniform float uK;
      uniform float uScale;
      uniform vec2 uOffset;
      uniform vec2 uResolution;
      uniform float uPixelRatio;
      uniform float uPointSize;
      uniform float uDepthMin;
      uniform float uDepthMax;
      varying float vTone;

      void main() {
        vec3 eye = vec3(400.0);
        vec3 right = vec3(0.70710678, -0.70710678, 0.0);
        vec3 up = vec3(0.40824829, 0.40824829, -0.81649658);
        vec3 forward = vec3(-0.57735027);
        vec3 point = vec3(aPoint.xy, -aPoint.z * uK);
        vec3 delta = point - eye;
        float depth = dot(delta, forward);
        float focal = 400.0 / tan(3.14159265 / 6.0);
        float sourceX = 400.0 + focal * dot(delta, right) / depth;
        float sourceY = 400.0 + focal * dot(delta, up) / depth;
        vec2 pixel = (uOffset + vec2(sourceX, sourceY) * uScale) * uPixelRatio;

        float normalizedDepth = (depth - uDepthMin) / max(1.0, uDepthMax - uDepthMin);
        gl_Position = vec4(pixel.x / uResolution.x * 2.0 - 1.0, 1.0 - pixel.y / uResolution.y * 2.0, normalizedDepth * 1.8 - .9, 1.0);
        gl_PointSize = uPointSize * uPixelRatio;
        vTone = min(1.0, aPoint.z / 255.0);
      }
    `;

    const fragmentSource = `
      precision mediump float;
      varying float vTone;

      void main() {
        if (vTone < 0.03) discard;
        gl_FragColor = vec4(vec3(vTone), 1.0);
      }
    `;

    function createShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, createShader(gl.VERTEX_SHADER, vertexSource));
    gl.attachShader(program, createShader(gl.FRAGMENT_SHADER, fragmentSource));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);

    const locations = {
      point: gl.getAttribLocation(program, "aPoint"),
      k: gl.getUniformLocation(program, "uK"),
      scale: gl.getUniformLocation(program, "uScale"),
      offset: gl.getUniformLocation(program, "uOffset"),
      resolution: gl.getUniformLocation(program, "uResolution"),
      pixelRatio: gl.getUniformLocation(program, "uPixelRatio"),
      pointSize: gl.getUniformLocation(program, "uPointSize"),
      depthMin: gl.getUniformLocation(program, "uDepthMin"),
      depthMax: gl.getUniformLocation(program, "uDepthMax"),
    };

    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.clearColor(0, 0, 0, 1);
    gl.enableVertexAttribArray(locations.point);

    function iterationsAt(x, y) {
      let real = 0;
      let imaginary = 0;
      let iteration = 0;
      while (real * real + imaginary * imaginary < 4 && iteration < maxIterations) {
        const next = real * real - imaginary * imaginary + x / halfSize - 1;
        imaginary = 2 * real * imaginary + y / halfSize;
        real = next;
        iteration += 1;
      }
      return iteration;
    }

    function buildPoints() {
      const density = Math.max(360, Math.min(440, Math.round(Math.sqrt(width * height) / 1.75)));
      const step = sceneSize / density;
      const data = new Float32Array(density * density * 3);
      let index = 0;

      for (let row = 0; row < density; row += 1) {
        const y = -halfSize + row * step;
        for (let column = 0; column < density; column += 1) {
          const x = -halfSize + column * step;
          data[index] = x;
          data[index + 1] = y;
          data[index + 2] = iterationsAt(x, y);
          index += 3;
        }
      }

      pointCount = density * density;
      pointData = data;
      if (!vertexBuffer) vertexBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
      gl.vertexAttribPointer(locations.point, 3, gl.FLOAT, false, 0, 0);
    }

    // Вписывает именно текущую перспективную проекцию, не меняя оси исходного скетча.
    function fitProjectedScene() {
      const eyeX = 400;
      const eyeY = 400;
      const eyeZ = 400;
      const focal = 400 / Math.tan(Math.PI / 6);
      const padding = Math.max(12, Math.min(width, height) * .035);
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      let nearDepth = Infinity;
      let farDepth = -Infinity;

      for (let index = 0; index < pointData.length; index += 3) {
        const dx = pointData[index] - eyeX;
        const dy = pointData[index + 1] - eyeY;
        const dz = -pointData[index + 2] * k - eyeZ;
        const depth = -(dx + dy + dz) * .57735027;
        if (depth <= 1) continue;

        const sourceX = 400 + focal * (dx - dy) * .70710678 / depth;
        const sourceY = 400 + focal * (dx + dy - dz * 2) * .40824829 / depth;
        minX = Math.min(minX, sourceX);
        minY = Math.min(minY, sourceY);
        maxX = Math.max(maxX, sourceX);
        maxY = Math.max(maxY, sourceY);
        nearDepth = Math.min(nearDepth, depth);
        farDepth = Math.max(farDepth, depth);
      }

      const projectedWidth = Math.max(1, maxX - minX);
      const projectedHeight = Math.max(1, maxY - minY);
      scale = Math.min((width - padding * 2) / projectedWidth, (height - padding * 2) / projectedHeight);
      offsetX = (width - projectedWidth * scale) * .5 - minX * scale;
      offsetY = (height - projectedHeight * scale) * .5 - minY * scale;
      depthMin = nearDepth;
      depthMax = Math.max(nearDepth + 1, farDepth);
    }

    function resize() {
      const bounds = canvas.getBoundingClientRect();
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = Math.max(1, Math.round(bounds.width));
      height = Math.max(1, Math.round(bounds.height));
      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);
      gl.viewport(0, 0, canvas.width, canvas.height);

      buildPoints();
      fitProjectedScene();
    }

    function draw() {
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.useProgram(program);
      gl.uniform1f(locations.k, k);
      gl.uniform1f(locations.scale, scale);
      gl.uniform2f(locations.offset, offsetX, offsetY);
      gl.uniform2f(locations.resolution, canvas.width, canvas.height);
      gl.uniform1f(locations.pixelRatio, pixelRatio);
      gl.uniform1f(locations.pointSize, Math.max(.85, Math.min(1.25, Math.min(width, height) / 620)));
      gl.uniform1f(locations.depthMin, depthMin);
      gl.uniform1f(locations.depthMax, depthMax);
      gl.drawArrays(gl.POINTS, 0, pointCount);
    }

    function frame() {
      if (!paused) k += .01;
      fitProjectedScene();
      draw();
      requestAnimationFrame(frame);
    }

    canvas.tabIndex = 0;
    canvas.addEventListener("click", () => { paused = !paused; });
    canvas.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        paused = !paused;
      }
    });
    reducedMotion.addEventListener("change", event => { paused = event.matches; });
    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", resize);

    resize();
    frame();
  </script>
</body>
</html>
