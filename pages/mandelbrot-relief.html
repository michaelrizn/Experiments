<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Рельеф Мандельброта</title>
  <style>
    :root { color-scheme: dark; background: #000; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #000; }
    main { min-height: calc(100dvh - 64px); display: grid; place-items: center; padding: 12px; overflow: hidden; }
    .canvas-frame { width: min(100%, 1180px); aspect-ratio: 16 / 10; }
    canvas { display: block; width: 100%; height: 100%; background: #000; touch-action: manipulation; }
  </style>
  <script src="../assets/toolbar.js" defer></script>
</head>
<body data-title="Рельеф Мандельброта" data-back="../">
  <main>
    <div class="canvas-frame">
      <canvas id="sketch" aria-label="Анимированный рельеф множества Мандельброта"></canvas>
    </div>
  </main>
  <script>
    // Адаптивная реализация исходного Processing-скетча с той же камерой и высотой -n * k.
    const canvas = document.querySelector("#sketch");
    const context = canvas.getContext("2d", { alpha: false });
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const worldSize = 500;
    const fractalScale = 400;
    const maxIterations = 400;
    const eye = { x: worldSize, y: worldSize, z: worldSize };
    const camera = {
      right: { x: Math.SQRT1_2, y: -Math.SQRT1_2, z: 0 },
      up: { x: -1 / Math.sqrt(6), y: -1 / Math.sqrt(6), z: 2 / Math.sqrt(6) },
      forward: { x: -1 / Math.sqrt(3), y: -1 / Math.sqrt(3), z: -1 / Math.sqrt(3) },
    };

    let pixelRatio = 1;
    let width = 1;
    let height = 1;
    let points = [];
    let k = 0;
    let paused = reducedMotion.matches;

    function iterationsAt(x, y) {
      let real = 0;
      let imaginary = 0;
      let iteration = 0;
      while (real * real + imaginary * imaginary < 4 && iteration < maxIterations) {
        const next = real * real - imaginary * imaginary + x / fractalScale - .75;
        imaginary = 2 * real * imaginary + y / fractalScale;
        real = next;
        iteration += 1;
      }
      return iteration;
    }

    function buildPoints() {
      // Детализация зависит от площади экрана, но сохраняет дискретный характер исходных точек.
      const density = Math.max(105, Math.min(220, Math.round(Math.sqrt(width * height) / 3.7)));
      points = [];
      for (let row = 0; row < density; row += 1) {
        const y = -worldSize + row / (density - 1) * worldSize * 2;
        for (let column = 0; column < density; column += 1) {
          const x = -worldSize + column / (density - 1) * worldSize * 2;
          points.push({ x, y, n: iterationsAt(x, y) });
        }
      }
    }

    function resize() {
      const bounds = canvas.getBoundingClientRect();
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = Math.max(1, Math.round(bounds.width));
      height = Math.max(1, Math.round(bounds.height));
      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);
      buildPoints();
    }

    function draw() {
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      context.fillStyle = "#000";
      context.fillRect(0, 0, width, height);

      const focal = Math.min(width, height) * .88;
      const centerX = width * .5;
      const centerY = height * .5;
      const scale = Math.min(width / height, 1) * .88;
      const pointSize = Math.max(.72, Math.min(1.12, Math.min(width, height) / 720));

      // Рисуем дальние точки первыми, как это делает буфер глубины в P3D.
      const projected = [];
      for (const point of points) {
        const z = -point.n * k;
        const dx = point.x - eye.x;
        const dy = point.y - eye.y;
        const dz = z - eye.z;
        const depth = dx * camera.forward.x + dy * camera.forward.y + dz * camera.forward.z;
        if (depth <= 8) continue;

        projected.push({
          depth,
          x: centerX + focal * scale * (dx * camera.right.x + dy * camera.right.y + dz * camera.right.z) / depth,
          y: centerY - focal * scale * (dx * camera.up.x + dy * camera.up.y + dz * camera.up.z) / depth,
          tone: Math.min(255, Math.round(point.n * .88)),
        });
      }

      projected.sort((a, b) => b.depth - a.depth);
      for (const point of projected) {
        if (point.x < -2 || point.x > width + 2 || point.y < -2 || point.y > height + 2) continue;
        context.fillStyle = `rgb(${point.tone} ${point.tone} ${point.tone})`;
        context.fillRect(point.x, point.y, pointSize, pointSize);
      }
    }

    function frame() {
      if (!paused) k += .01;
      draw();
      requestAnimationFrame(frame);
    }

    canvas.tabIndex = 0;
    canvas.addEventListener("click", () => { paused = !paused; });
    canvas.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        paused = !paused;
      }
    });
    reducedMotion.addEventListener("change", event => { paused = event.matches; });
    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", resize);

    resize();
    frame();
  </script>
</body>
</html>
