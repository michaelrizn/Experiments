<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Рельеф Мандельброта</title>
  <style>
    :root { color-scheme: dark; background: #000; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #000; }
    main { min-height: calc(100dvh - 64px); display: grid; place-items: center; padding: 12px; overflow: hidden; }
    .canvas-frame { width: min(100%, 1180px); aspect-ratio: 16 / 10; }
    canvas { display: block; width: 100%; height: 100%; background: #000; touch-action: manipulation; }
  </style>
  <script src="../assets/toolbar.js" defer></script>
</head>
<body data-title="Рельеф Мандельброта" data-back="../">
  <main>
    <div class="canvas-frame">
      <canvas id="sketch" aria-label="Анимированный рельеф множества Мандельброта"></canvas>
    </div>
  </main>
  <script>
    // Точная область и камера исходного Processing-скетча; адаптируется только экранная проекция.
    const canvas = document.querySelector("#sketch");
    const context = canvas.getContext("2d", { alpha: false });
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    const halfSize = 400;
    const maxIterations = 400;
    const eye = { x: 400, y: 400, z: 400 };
    const camera = {
      right: { x: Math.SQRT1_2, y: -Math.SQRT1_2, z: 0 },
      up: { x: 1 / Math.sqrt(6), y: 1 / Math.sqrt(6), z: -2 / Math.sqrt(6) },
      forward: { x: -1 / Math.sqrt(3), y: -1 / Math.sqrt(3), z: -1 / Math.sqrt(3) },
    };

    let pixelRatio = 1;
    let width = 1;
    let height = 1;
    let points = [];
    let k = 0;
    let paused = reducedMotion.matches;

    function iterationsAt(x, y) {
      let real = 0;
      let imaginary = 0;
      let iteration = 0;
      while (real * real + imaginary * imaginary < 4 && iteration < maxIterations) {
        const next = real * real - imaginary * imaginary + x / halfSize - 1;
        imaginary = 2 * real * imaginary + y / halfSize;
        real = next;
        iteration += 1;
      }
      return iteration;
    }

    function buildPoints() {
      const density = Math.max(130, Math.min(260, Math.round(Math.sqrt(width * height) / 3.1)));
      points = [];
      for (let row = 0; row < density; row += 1) {
        const y = -halfSize + row / (density - 1) * halfSize * 2;
        for (let column = 0; column < density; column += 1) {
          const x = -halfSize + column / (density - 1) * halfSize * 2;
          points.push({ x, y, n: iterationsAt(x, y) });
        }
      }
    }

    function resize() {
      const bounds = canvas.getBoundingClientRect();
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = Math.max(1, Math.round(bounds.width));
      height = Math.max(1, Math.round(bounds.height));
      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);
      buildPoints();
    }

    function draw() {
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      context.fillStyle = "#000";
      context.fillRect(0, 0, width, height);

      // Проецируем сцену так же, как Processing P3D, затем вписываем её
      // фактические границы в адаптивный широкий canvas без изменения геометрии.
      const focal = 800 * .5 / Math.tan(Math.PI / 6);
      const projected = [];
      let minX = Infinity;
      let maxX = -Infinity;
      let minY = Infinity;
      let maxY = -Infinity;

      for (const point of points) {
        const z = -point.n * k;
        const dx = point.x - eye.x;
        const dy = point.y - eye.y;
        const dz = z - eye.z;
        const depth = dx * camera.forward.x + dy * camera.forward.y + dz * camera.forward.z;
        if (depth <= 4) continue;

        const sourceX = focal * (dx * camera.right.x + dy * camera.right.y) / depth;
        const sourceY = -focal * (dx * camera.up.x + dy * camera.up.y + dz * camera.up.z) / depth;

        // Поворот экранной проекции на 90° по часовой стрелке.
        const x = -sourceY;
        const y = sourceX;
        projected.push({ depth, x, y, tone: Math.max(0, 255 - point.n) });
        minX = Math.min(minX, x);
        maxX = Math.max(maxX, x);
        minY = Math.min(minY, y);
        maxY = Math.max(maxY, y);
      }

      if (!projected.length) return;

      const padding = Math.max(14, Math.min(width, height) * .055);
      const scale = Math.min(
        (width - padding * 2) / Math.max(1, maxX - minX),
        (height - padding * 2) / Math.max(1, maxY - minY)
      );
      const offsetX = (width - (maxX - minX) * scale) * .5 - minX * scale;
      const offsetY = (height - (maxY - minY) * scale) * .5 - minY * scale;
      const pointSize = Math.max(.65, Math.min(1.05, Math.min(width, height) / 760));

      projected.sort((a, b) => b.depth - a.depth);
      for (const point of projected) {
        const x = offsetX + point.x * scale;
        const y = offsetY + point.y * scale;
        context.fillStyle = `rgb(${point.tone} ${point.tone} ${point.tone})`;
        context.fillRect(x, y, pointSize, pointSize);
      }
    }

    function frame() {
      if (!paused) k += .01;
      draw();
      requestAnimationFrame(frame);
    }

    canvas.tabIndex = 0;
    canvas.addEventListener("click", () => { paused = !paused; });
    canvas.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        paused = !paused;
      }
    });
    reducedMotion.addEventListener("change", event => { paused = event.matches; });
    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", resize);

    resize();
    frame();
  </script>
</body>
</html>
