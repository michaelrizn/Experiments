<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Текучая сфера</title>
  <style>
    :root { color-scheme:dark; background:#000; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; background:#000; }
    main { min-height:100vh; display:grid; place-items:center; padding:20px; }
    canvas { display:block; width:min(100%, 680px); height:auto; aspect-ratio:1; background:#000; touch-action:manipulation; }
  </style>
  <script src="../assets/toolbar.js" defer></script>
</head>
<body data-title="Текучая сфера" data-back="../">
  <main>
    <canvas id="sketch" aria-label="Анимированная текучая сфера"></canvas>
  </main>
  <script>
    const canvas = document.querySelector("#sketch");
    const ctx = canvas.getContext("2d", { alpha: false });
    const size = 600;
    const step = Math.PI / 40;
    const rotationX = .5;
    const rotationY = -.5;
    let time = 0;
    let paused = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function setResolution() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = size * ratio;
      canvas.height = size * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function project(x, y, z) {
      const y1 = y * Math.cos(rotationX) - z * Math.sin(rotationX);
      const z1 = y * Math.sin(rotationX) + z * Math.cos(rotationX);
      const x1 = x * Math.cos(rotationY) + z1 * Math.sin(rotationY);
      const z2 = -x * Math.sin(rotationY) + z1 * Math.cos(rotationY);
      const perspective = 520 / (520 - z2);
      return { x: x1 * perspective + size / 2, y: y1 * perspective + size / 2, z: z2, scale: perspective };
    }

    function draw() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, size, size);
      const dots = [];
      for (let y = 0; y < 40; y++) {
        const v = (y + time) * step * 2;
        for (let x = 0; x < 80; x++) {
          const u = (x + time) * step;
          const radius = 90;
          const point = project(
            (2 + Math.sin(v)) * Math.cos(u) * radius,
            (2 + Math.sin(v)) * Math.sin(u) * radius,
            Math.cos(v) * radius,
          );
          dots.push({ ...point, radius: Math.max(.7, (Math.cos(v) + .3) * 2.7 * point.scale) });
        }
      }
      dots.sort((a, b) => a.z - b.z);
      ctx.fillStyle = "#f4f4f4";
      for (const dot of dots) {
        ctx.globalAlpha = Math.max(.12, Math.min(1, (dot.z + 160) / 300));
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function frame() {
      if (!paused) time = (time + .02) % 1;
      draw();
      requestAnimationFrame(frame);
    }

    canvas.addEventListener("click", () => { paused = !paused; });
    canvas.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); paused = !paused; }
    });
    canvas.tabIndex = 0;
    canvas.setAttribute("aria-label", "Анимированная текучая сфера. Нажмите, чтобы остановить или запустить.");
    setResolution();
    frame();
  </script>
</body>
</html>
