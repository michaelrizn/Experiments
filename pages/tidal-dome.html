<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Приливный купол</title>
  <style>
    :root { color-scheme:dark; background:#000; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; background:#000; }
    main { min-height:calc(100dvh - 64px); display:grid; place-items:center; padding:12px; overflow:hidden; }
    .canvas-frame { width:min(100%, 1100px); aspect-ratio:16 / 9; }
    canvas { display:block; width:100%; height:100%; background:#000; touch-action:manipulation; }
  </style>
  <script src="../assets/toolbar.js" defer></script>
</head>
<body data-title="Приливный купол" data-back="../">
  <main>
    <div class="canvas-frame">
      <canvas id="sketch" aria-label="Анимированный приливный купол"></canvas>
    </div>
  </main>
  <script>
    const canvas = document.querySelector("#sketch");
    const ctx = canvas.getContext("2d", { alpha: false });
    const sceneSize = 400;
    let pixelRatio = 1;
    let viewWidth = sceneSize;
    let viewHeight = sceneSize;
    let sceneScale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let time = 0;
    let paused = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function setResolution() {
      const bounds = canvas.getBoundingClientRect();
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      viewWidth = Math.max(1, Math.round(bounds.width));
      viewHeight = Math.max(1, Math.round(bounds.height));
      sceneScale = Math.min(viewWidth / sceneSize, viewHeight / sceneSize);
      offsetX = (viewWidth - sceneSize * sceneScale) / 2;
      offsetY = (viewHeight - sceneSize * sceneScale) / 2;
      canvas.width = Math.round(viewWidth * pixelRatio);
      canvas.height = Math.round(viewHeight * pixelRatio);
    }

    function project(x, y, z) {
      const angle = time;
      const rotatedX = x * Math.cos(angle) + z * Math.sin(angle);
      const rotatedZ = -x * Math.sin(angle) + z * Math.cos(angle);
      const perspective = 560 / (560 - rotatedZ);
      return {
        x: sceneSize / 2 + rotatedX * perspective,
        y: sceneSize / 2 + y * perspective,
        z: rotatedZ,
        scale: perspective,
      };
    }

    function draw() {
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, viewWidth, viewHeight);
      ctx.setTransform(
        pixelRatio * sceneScale, 0, 0, pixelRatio * sceneScale,
        pixelRatio * offsetX, pixelRatio * offsetY,
      );

      const dots = [];
      for (let u = 0; u <= Math.PI * 2; u += Math.PI / 64) {
        const phaseU = u + time / sceneSize;
        for (let v = Math.PI; v > Math.PI / 2; v -= Math.PI / 64) {
          const phaseV = v - (time % (Math.PI / 8192));
          const radius = 120 * Math.cos(v + time);
          const point = project(
            Math.sin(phaseU) * Math.sin(phaseV) * radius,
            Math.atan(phaseV) * radius,
            Math.cos(phaseU) * Math.sin(phaseV) * radius,
          );
          dots.push({ ...point, radius: Math.max(.55, Math.abs(Math.sin(u * v)) * 2.5 * point.scale) });
        }
      }

      dots.sort((first, second) => first.z - second.z);
      ctx.fillStyle = "#f5f5f5";
      for (const dot of dots) {
        ctx.globalAlpha = Math.max(.12, Math.min(1, (dot.z + 150) / 300));
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function frame() {
      if (!paused) time += Math.PI / 256;
      draw();
      requestAnimationFrame(frame);
    }

    canvas.addEventListener("click", () => { paused = !paused; });
    canvas.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        paused = !paused;
      }
    });
    canvas.tabIndex = 0;
    canvas.setAttribute("aria-label", "Анимированный приливный купол. Нажмите, чтобы остановить или запустить.");
    setResolution();
    window.addEventListener("resize", setResolution);
    window.addEventListener("orientationchange", setResolution);
    frame();
  </script>
</body>
</html>
