<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060606">
  <title>Светопад</title>
  <style>
    :root { color-scheme:dark; background:#060606; } * { box-sizing:border-box; } html,body { min-height:100%; margin:0; background:#060606; }
    main { height:calc(100dvh - 64px); display:grid; place-items:center; padding:12px; overflow:hidden; } .canvas-frame { height:min(900px, calc(100dvh - 88px), calc((100vw - 24px) * 16 / 9)); aspect-ratio:9 / 16; } canvas { display:block; width:100%; height:100%; background:#060606; touch-action:manipulation; }
    @media (max-width:720px) { .toolbar + main { height:calc(100dvh - 64px - env(safe-area-inset-top)); } .canvas-frame { height:min(calc(100dvh - 88px - env(safe-area-inset-top)), calc((100vw - 24px) * 16 / 9)); } }
  </style>
  <script src="../assets/toolbar.js" defer></script>
</head>
<body data-title="Светопад" data-back="../">
  <main><div class="canvas-frame"><canvas id="sketch" aria-label="Падающие световые нити"></canvas></div></main>
  <script>
    const canvas = document.querySelector("#sketch"), ctx = canvas.getContext("2d", { alpha:false });
    let ratio=1,width=360,height=640,time=0,paused=matchMedia("(prefers-reduced-motion: reduce)").matches;
    function resize(){const b=canvas.getBoundingClientRect();ratio=Math.min(devicePixelRatio||1,2);width=Math.max(1,Math.round(b.width));height=Math.max(1,Math.round(b.height));canvas.width=width*ratio;canvas.height=height*ratio;}
    function draw(){ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle="#060606";ctx.fillRect(0,0,width,height);const s=Math.min(width/360,height/640);ctx.translate(width/2,height/2);ctx.scale(s,s);ctx.lineCap="round";
      for(let i=0;i<78;i++){const seed=i*12.9898, phase=(time*(.65+(i%5)*.08)+i*.173)%1, x=(i/77-.5)*304+Math.sin(time*1.4+seed)*18, top=-346+phase*720, len=62+50*Math.sin(seed);const bend=Math.sin(time*2+seed)*32;const g=ctx.createLinearGradient(x,top,x+bend,top+len);g.addColorStop(0,"rgb(255 255 255 / 0)");g.addColorStop(.48,"rgb(255 255 255 / .72)");g.addColorStop(1,"rgb(255 255 255 / 0)");ctx.strokeStyle=g;ctx.lineWidth=.7+(i%4)*.28;ctx.beginPath();ctx.moveTo(x,top);ctx.quadraticCurveTo(x+bend,top+len*.55,x+bend*.35,top+len);ctx.stroke();}
      ctx.setTransform(ratio,0,0,ratio,0,0);
    }
    function frame(){if(!paused)time+=.011;draw();requestAnimationFrame(frame);} canvas.tabIndex=0;canvas.onclick=()=>paused=!paused;canvas.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();paused=!paused;}};resize();addEventListener("resize",resize);addEventListener("orientationchange",resize);frame();
  </script>
</body>
</html>
