<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <title>Волновая хризантема</title>
  <style>
    :root { color-scheme:dark; background:#090909; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; background:#090909; }
    main { min-height:calc(100dvh - 64px); display:grid; place-items:center; padding:12px; overflow:hidden; }
    canvas { display:block; width:min(100%, 1100px); height:auto; aspect-ratio:16 / 9; background:#090909; touch-action:manipulation; }
  </style>
  <script src="../assets/toolbar.js" defer></script>
</head>
<body data-title="Волновая хризантема" data-back="../">
  <main>
    <canvas id="sketch" aria-label="Анимированная генеративная композиция"></canvas>
  </main>
  <script>
    const canvas = document.querySelector("#sketch");
    const ctx = canvas.getContext("2d", { alpha: false });
    const size = 400;
    let pixelRatio = 1;
    let viewWidth = size;
    let viewHeight = size;
    let sceneScale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let time = 0;
    let paused = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function setResolution() {
      const bounds = canvas.getBoundingClientRect();
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      viewWidth = Math.max(1, Math.round(bounds.width));
      viewHeight = Math.max(1, Math.round(bounds.height));
      sceneScale = Math.min(viewWidth / size, viewHeight / size);
      offsetX = (viewWidth - size * sceneScale) / 2;
      offsetY = (viewHeight - size * sceneScale) / 2;
      canvas.width = Math.round(viewWidth * pixelRatio);
      canvas.height = Math.round(viewHeight * pixelRatio);
    }

    function draw() {
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      ctx.fillStyle = "#090909";
      ctx.fillRect(0, 0, viewWidth, viewHeight);
      ctx.setTransform(pixelRatio * sceneScale, 0, 0, pixelRatio * sceneScale, pixelRatio * offsetX, pixelRatio * offsetY);
      ctx.fillStyle = "rgba(255, 255, 255, .376)";
      for (let i = 10000; i > 0; i--) {
        const y = i / 353;
        const k = ((y < 9 ? 9 : 5) + Math.cos(y * 31 - time)) * Math.cos(i / 44);
        const e = y / 9 - 14;
        const d = Math.hypot(k, e) / 1.6;
        const c = d - time / 2;
        const x = (d * 9 + k * k) * Math.cos(c) + 200;
        const py = (55 + d * 9) * Math.sin(c / 3) + 4 * Math.sin(k * 2) + y / 29 * k * (e + 3 * Math.sin(e * 4 - d * 4 + time * 3)) + 200;
        ctx.fillRect(x, py, 1, 1);
      }
    }

    function frame() {
      if (!paused) time += Math.PI / 80;
      draw();
      requestAnimationFrame(frame);
    }

    canvas.addEventListener("click", () => { paused = !paused; });
    canvas.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); paused = !paused; }
    });
    canvas.tabIndex = 0;
    canvas.setAttribute("aria-label", "Анимированная генеративная композиция. Нажмите, чтобы остановить или запустить.");
    setResolution();
    window.addEventListener("resize", setResolution);
    frame();
  </script>
</body>
</html>
