<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <title>Волновая хризантема</title>
  <style>
    :root { color-scheme:dark; background:#090909; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; background:#090909; }
    main { min-height:100vh; display:grid; place-items:center; padding:20px; }
    canvas { display:block; width:min(100%, 560px); height:auto; aspect-ratio:1; background:#090909; touch-action:manipulation; }
  </style>
  <script src="../assets/toolbar.js" defer></script>
</head>
<body data-title="Волновая хризантема" data-back="../">
  <main>
    <canvas id="sketch" aria-label="Анимированная генеративная композиция"></canvas>
  </main>
  <script>
    const canvas = document.querySelector("#sketch");
    const ctx = canvas.getContext("2d", { alpha: false });
    const size = 400;
    let time = 0;
    let paused = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function setResolution() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = size * ratio;
      canvas.height = size * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function draw() {
      ctx.fillStyle = "#090909";
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = "rgba(255, 255, 255, .376)";
      for (let i = 10000; i > 0; i--) {
        const y = i / 353;
        const k = ((y < 9 ? 9 : 5) + Math.cos(y * 31 - time)) * Math.cos(i / 44);
        const e = y / 9 - 14;
        const d = Math.hypot(k, e) / 1.6;
        const c = d - time / 2;
        const x = (d * 9 + k * k) * Math.cos(c) + 200;
        const py = (55 + d * 9) * Math.sin(c / 3) + 4 * Math.sin(k * 2) + y / 29 * k * (e + 3 * Math.sin(e * 4 - d * 4 + time * 3)) + 200;
        ctx.fillRect(x, py, 1, 1);
      }
    }

    function frame() {
      if (!paused) time += Math.PI / 80;
      draw();
      requestAnimationFrame(frame);
    }

    canvas.addEventListener("click", () => { paused = !paused; });
    canvas.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); paused = !paused; }
    });
    canvas.tabIndex = 0;
    canvas.setAttribute("aria-label", "Анимированная генеративная композиция. Нажмите, чтобы остановить или запустить.");
    setResolution();
    frame();
  </script>
</body>
</html>
