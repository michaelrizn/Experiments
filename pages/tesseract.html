<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Тессеракт</title>
  <style>
    :root { color-scheme:dark; background:#000; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; background:#000; }
    main { min-height:100vh; display:grid; place-items:center; padding:20px; }
    canvas { display:block; width:min(100%, 700px); height:auto; aspect-ratio:1; background:#000; touch-action:manipulation; }
  </style>
  <script src="../assets/toolbar.js" defer></script>
</head>
<body data-title="Тессеракт" data-back="../">
  <main>
    <canvas id="sketch" aria-label="Анимированная проекция четырёхмерного гиперкуба"></canvas>
  </main>
  <script>
    const canvas = document.querySelector("#sketch");
    const ctx = canvas.getContext("2d", { alpha: false });
    const size = 700;
    const vertices = [];
    const edges = [];
    let time = 0;
    let paused = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    for (let index = 0; index < 16; index++) {
      vertices.push([
        index & 1 ? 1 : -1,
        index & 2 ? 1 : -1,
        index & 4 ? 1 : -1,
        index & 8 ? 1 : -1,
      ]);
      for (let axis = 0; axis < 4; axis++) {
        const neighbour = index ^ (1 << axis);
        if (index < neighbour) edges.push([index, neighbour]);
      }
    }

    function setResolution() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = size * ratio;
      canvas.height = size * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function rotate(point, first, second, angle) {
      const result = [...point];
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      result[first] = point[first] * cos - point[second] * sin;
      result[second] = point[first] * sin + point[second] * cos;
      return result;
    }

    function project(point) {
      let rotated = rotate(point, 0, 3, time * .82);
      rotated = rotate(rotated, 1, 3, time * .57 + .7);
      rotated = rotate(rotated, 2, 3, time * .38);
      const fourthPerspective = 3.4 / (3.4 - rotated[3]);
      const x = rotated[0] * fourthPerspective;
      const y = rotated[1] * fourthPerspective;
      const z = rotated[2] * fourthPerspective;
      const cos = Math.cos(-.36);
      const sin = Math.sin(-.36);
      const tiltedY = y * cos - z * sin;
      const tiltedZ = y * sin + z * cos;
      const depth = 4.2 / (4.2 - tiltedZ);
      return {
        x: size / 2 + x * depth * 185,
        y: size / 2 + tiltedY * depth * 185,
        z: tiltedZ,
        scale: depth,
      };
    }

    function draw() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, size, size);
      const points = vertices.map(project);
      const orderedEdges = edges
        .map(([from, to]) => ({ from: points[from], to: points[to], depth: (points[from].z + points[to].z) / 2 }))
        .sort((first, second) => first.depth - second.depth);

      ctx.lineCap = "round";
      for (const edge of orderedEdges) {
        const glow = Math.max(.16, Math.min(1, (edge.depth + 2.2) / 4.4));
        ctx.strokeStyle = `rgb(220 236 255 / ${glow})`;
        ctx.lineWidth = 1.2 + edge.from.scale * .9;
        ctx.beginPath();
        ctx.moveTo(edge.from.x, edge.from.y);
        ctx.lineTo(edge.to.x, edge.to.y);
        ctx.stroke();
      }

      points.sort((first, second) => first.z - second.z);
      for (const point of points) {
        const radius = 3.5 * point.scale;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function frame() {
      if (!paused) time += .012;
      draw();
      requestAnimationFrame(frame);
    }

    canvas.addEventListener("click", () => { paused = !paused; });
    canvas.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); paused = !paused; }
    });
    canvas.tabIndex = 0;
    canvas.setAttribute("aria-label", "Анимированная проекция четырёхмерного гиперкуба. Нажмите, чтобы остановить или запустить.");
    setResolution();
    frame();
  </script>
</body>
</html>
