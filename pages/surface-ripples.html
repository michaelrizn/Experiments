<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Круги на поверхности</title>
  <style>
    :root { color-scheme:dark; background:#000; } * { box-sizing:border-box; } html,body { min-height:100%; margin:0; background:#000; }
    main { min-height:calc(100dvh - 64px); display:grid; place-items:center; padding:12px; overflow:hidden; } .canvas-frame { width:min(100%, 1100px); aspect-ratio:16 / 9; } canvas { display:block; width:100%; height:100%; background:#000; touch-action:manipulation; }
  </style>
  <script src="../assets/toolbar.js" defer></script>
</head>
<body data-title="Круги на поверхности" data-back="../">
  <main><div class="canvas-frame"><canvas id="sketch" aria-label="Анимированные круги на поверхности"></canvas></div></main>
  <script>
    const canvas=document.querySelector("#sketch"),ctx=canvas.getContext("2d",{alpha:false});let ratio=1,width=800,height=450,time=0,paused=matchMedia("(prefers-reduced-motion: reduce)").matches;
    function resize(){const b=canvas.getBoundingClientRect();ratio=Math.min(devicePixelRatio||1,2);width=Math.max(1,Math.round(b.width));height=Math.max(1,Math.round(b.height));canvas.width=width*ratio;canvas.height=height*ratio;}
    function draw(){ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle="#000";ctx.fillRect(0,0,width,height);const s=Math.min(width/780,height/430);for(let y=-15;y<=15;y++)for(let x=-28;x<=28;x++){const dx=x*12,dy=y*12,r=Math.hypot(dx,dy);const wave=Math.sin(r*.075-time*3.2)*Math.exp(-r*.008);const px=width/2+(dx+wave*28)*s,py=height/2+(dy+wave*20)*s;ctx.globalAlpha=.16+Math.max(0,wave)*.7;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(px,py,.55+Math.max(0,wave)*1.2,0,Math.PI*2);ctx.fill();}for(let ring=0;ring<8;ring++){const r=(ring*38+time*48)%305;ctx.strokeStyle=`rgb(255 255 255 / ${.24*(1-r/330)})`;ctx.lineWidth=.6;ctx.beginPath();ctx.ellipse(width/2,height/2,r*s,r*s*.58,0,0,Math.PI*2);ctx.stroke();}ctx.globalAlpha=1;}
    function frame(){if(!paused)time+=.012;draw();requestAnimationFrame(frame);}canvas.tabIndex=0;canvas.onclick=()=>paused=!paused;canvas.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();paused=!paused;}};resize();addEventListener("resize",resize);addEventListener("orientationchange",resize);frame();
  </script>
</body>
</html>
