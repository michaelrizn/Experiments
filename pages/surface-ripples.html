<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Круги на поверхности</title>
  <style>
    :root { color-scheme:dark; background:#000; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; background:#000; }
    main { height:calc(100dvh - 64px); min-height:calc(100dvh - 64px); display:grid; place-items:center; padding:12px; overflow:hidden; }
    .canvas-frame { width:min(100%, 1100px); aspect-ratio:16 / 9; }
    canvas { display:block; width:100%; height:100%; background:#000; touch-action:manipulation; }
    @media (max-width:720px) {
      .toolbar + main { height:calc(100dvh - 64px - env(safe-area-inset-top)) !important; min-height:calc(100dvh - 64px - env(safe-area-inset-top)) !important; }
      .canvas-frame { width:auto; max-width:100%; height:calc(100dvh - 88px - env(safe-area-inset-top)); aspect-ratio:9 / 16; }
    }
  </style>
  <script src="../assets/toolbar.js" defer></script>
</head>
<body data-title="Круги на поверхности" data-back="../">
  <main><div class="canvas-frame"><canvas id="sketch" aria-label="Анимированные круги на поверхности"></canvas></div></main>
  <script>
    const canvas=document.querySelector("#sketch");
    const ctx=canvas.getContext("2d",{alpha:false});
    let ratio=1,width=800,height=450,time=0;
    let paused=matchMedia("(prefers-reduced-motion: reduce)").matches;

    function resize(){
      const box=canvas.getBoundingClientRect();
      ratio=Math.min(devicePixelRatio||1,2);
      width=Math.max(1,Math.round(box.width));
      height=Math.max(1,Math.round(box.height));
      canvas.width=width*ratio;
      canvas.height=height*ratio;
    }

    function draw(){
      ctx.setTransform(ratio,0,0,ratio,0,0);
      ctx.fillStyle="#000";
      ctx.fillRect(0,0,width,height);

      const portrait=height>width;
      const spacing=Math.max(13,Math.min(23,Math.min(width,height)/23));
      const columns=Math.ceil(width/spacing)+2;
      const rows=Math.ceil(height/spacing)+2;
      const scene=Math.min(width,height);
      const rippleRadius=scene*.43;
      const centers=portrait
        ? [[width*.5,height*.19],[width*.5,height*.5],[width*.5,height*.81]]
        : [[width*.24,height*.5],[width*.5,height*.5],[width*.76,height*.5]];

      for(let row=0;row<rows;row++){
        for(let col=0;col<columns;col++){
          const baseX=(col-1)*spacing;
          const baseY=(row-1)*spacing;
          let offsetX=0,offsetY=0,ripple=0;
          for(const [cx,cy] of centers){
            const dx=baseX-cx,dy=baseY-cy;
            const distance=Math.hypot(dx,dy);
            const normalized=distance/rippleRadius;
            const envelope=Math.exp(-normalized*2.25);
            const wave=Math.sin(normalized*20-time*3.1)*envelope;
            const strength=Math.max(0,wave);
            ripple=Math.max(ripple,strength);
            if(distance>0.01){
              offsetX+=dx/distance*wave*spacing*.44;
              offsetY+=dy/distance*wave*spacing*.44;
            }
          }
          const x=baseX+offsetX;
          const y=baseY+offsetY;

          ctx.globalAlpha=.18+ripple*.82;
          ctx.fillStyle="#fff";
          ctx.beginPath();
          ctx.arc(x,y,.72+ripple*1.55,0,Math.PI*2);
          ctx.fill();
        }
      }

      for(const [cx,cy] of centers){
        for(let ring=0;ring<4;ring++){
          const phase=(ring/4+time*.085)%1;
          ctx.globalAlpha=.38*(1-phase);
          ctx.strokeStyle="#fff";
          ctx.lineWidth=.8;
          ctx.beginPath();
          ctx.arc(cx,cy,rippleRadius*phase,0,Math.PI*2);
          ctx.stroke();
        }
      }
      ctx.globalAlpha=1;
    }

    function frame(){
      if(!paused)time+=.012;
      draw();
      requestAnimationFrame(frame);
    }

    canvas.tabIndex=0;
    canvas.onclick=()=>paused=!paused;
    canvas.onkeydown=event=>{
      if(event.key==="Enter"||event.key===" "){
        event.preventDefault();
        paused=!paused;
      }
    };

    resize();
    addEventListener("resize",resize);
    addEventListener("orientationchange",resize);
    frame();
  </script>
</body>
</html>
