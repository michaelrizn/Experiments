<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Круги на поверхности</title>
  <style>
    :root { color-scheme:dark; background:#000; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; background:#000; }
    main { height:calc(100dvh - 64px); min-height:calc(100dvh - 64px); display:grid; place-items:center; padding:12px; overflow:hidden; }
    .canvas-frame { width:min(100%, 1100px); aspect-ratio:16 / 9; }
    canvas { display:block; width:100%; height:100%; background:#000; touch-action:manipulation; }
    @media (max-width:720px) {
      .toolbar + main { height:calc(100dvh - 64px - env(safe-area-inset-top)) !important; min-height:calc(100dvh - 64px - env(safe-area-inset-top)) !important; }
      .canvas-frame { width:auto; max-width:100%; height:calc(100dvh - 88px - env(safe-area-inset-top)); aspect-ratio:9 / 16; }
    }
  </style>
  <script src="../assets/toolbar.js" defer></script>
</head>
<body data-title="Круги на поверхности" data-back="../">
  <main><div class="canvas-frame"><canvas id="sketch" aria-label="Анимированные круги на поверхности"></canvas></div></main>
  <script>
    const canvas=document.querySelector("#sketch");
    const ctx=canvas.getContext("2d",{alpha:false});
    let ratio=1,width=800,height=450,time=0;
    let paused=matchMedia("(prefers-reduced-motion: reduce)").matches;

    function resize(){
      const box=canvas.getBoundingClientRect();
      ratio=Math.min(devicePixelRatio||1,2);
      width=Math.max(1,Math.round(box.width));
      height=Math.max(1,Math.round(box.height));
      canvas.width=width*ratio;
      canvas.height=height*ratio;
    }

    function draw(){
      ctx.setTransform(ratio,0,0,ratio,0,0);
      ctx.fillStyle="#000";
      ctx.fillRect(0,0,width,height);

      const portrait=height>width;
      const spacing=Math.max(13,Math.min(24,portrait?width/25:height/23));
      const columns=Math.ceil(width/spacing)+2;
      const rows=Math.ceil(height/spacing)+2;
      const cx=width/2,cy=height/2;
      const rx=width*.44,ry=height*.43;

      for(let row=0;row<rows;row++){
        for(let col=0;col<columns;col++){
          const baseX=(col-1)*spacing;
          const baseY=(row-1)*spacing;
          const nx=(baseX-cx)/rx;
          const ny=(baseY-cy)/ry;
          const distance=Math.hypot(nx,ny);
          const envelope=Math.exp(-distance*2.65);
          const wave=Math.sin(distance*25-time*3.3)*envelope;
          const ripple=Math.max(0,wave);
          const angle=Math.atan2(ny,nx);
          const offset=wave*spacing*.62;
          const x=baseX+Math.cos(angle)*offset;
          const y=baseY+Math.sin(angle)*offset;

          ctx.globalAlpha=.10+ripple*.84;
          ctx.fillStyle="#fff";
          ctx.beginPath();
          ctx.arc(x,y,.55+ripple*1.7,0,Math.PI*2);
          ctx.fill();
        }
      }

      for(let ring=0;ring<8;ring++){
        const phase=(ring/8+time*.085)%1;
        const alpha=.28*(1-phase);
        ctx.globalAlpha=alpha;
        ctx.strokeStyle="#fff";
        ctx.lineWidth=.65;
        ctx.beginPath();
        ctx.ellipse(cx,cy,rx*phase,ry*phase,0,0,Math.PI*2);
        ctx.stroke();
      }
      ctx.globalAlpha=1;
    }

    function frame(){
      if(!paused)time+=.012;
      draw();
      requestAnimationFrame(frame);
    }

    canvas.tabIndex=0;
    canvas.onclick=()=>paused=!paused;
    canvas.onkeydown=event=>{
      if(event.key==="Enter"||event.key===" "){
        event.preventDefault();
        paused=!paused;
      }
    };

    resize();
    addEventListener("resize",resize);
    addEventListener("orientationchange",resize);
    frame();
  </script>
</body>
</html>
