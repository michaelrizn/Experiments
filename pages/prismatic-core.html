<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Призматическое ядро</title>
  <style>
    :root { color-scheme:dark; background:#000; } * { box-sizing:border-box; } html,body { min-height:100%; margin:0; background:#000; }
    main { min-height:calc(100dvh - 64px); display:grid; place-items:center; padding:12px; overflow:hidden; } .canvas-frame { width:min(100%, 1100px); aspect-ratio:16 / 9; } canvas { display:block; width:100%; height:100%; background:#000; touch-action:manipulation; }
  </style>
  <script src="../assets/toolbar.js" defer></script>
</head>
<body data-title="Призматическое ядро" data-back="../">
  <main><div class="canvas-frame"><canvas id="sketch" aria-label="Анимированное призматическое ядро"></canvas></div></main>
  <script>
    const canvas = document.querySelector("#sketch"), ctx = canvas.getContext("2d", { alpha:false });
    let ratio=1,width=800,height=450,time=0,paused=matchMedia("(prefers-reduced-motion: reduce)").matches;
    function resize(){const b=canvas.getBoundingClientRect();ratio=Math.min(devicePixelRatio||1,2);width=Math.max(1,Math.round(b.width));height=Math.max(1,Math.round(b.height));canvas.width=width*ratio;canvas.height=height*ratio;}
    function project(x,y,z){const yaw=time*.42,pitch=.58;const x1=x*Math.cos(yaw)+z*Math.sin(yaw),z1=-x*Math.sin(yaw)+z*Math.cos(yaw),y1=y*Math.cos(pitch)-z1*Math.sin(pitch),z2=y*Math.sin(pitch)+z1*Math.cos(pitch),p=580/(580-z2);return{x:x1*p,y:y1*p,z:z2};}
    function draw(){ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle="#000";ctx.fillRect(0,0,width,height);const lines=[];for(let layer=0;layer<13;layer++){const sides=6+(layer%3),r=42+layer*17,z=(layer-6)*14,verts=[];for(let n=0;n<sides;n++){const a=n/sides*Math.PI*2+time*(layer%2?-.4:.4)+layer*.19;verts.push(project(Math.cos(a)*r,Math.sin(a)*r,z));}for(let n=0;n<sides;n++)lines.push([verts[n],verts[(n+1)%sides],layer]);if(layer){const previousSides=6+((layer-1)%3);for(let n=0;n<Math.min(sides,previousSides);n++){const a=n/sides*Math.PI*2+time*(layer%2?-.4:.4)+layer*.19;const b=n/previousSides*Math.PI*2+time*((layer-1)%2?-.4:.4)+(layer-1)*.19;lines.push([project(Math.cos(a)*r,Math.sin(a)*r,z),project(Math.cos(b)*(r-17),Math.sin(b)*(r-17),z-14),layer]);}}}const s=Math.min(width/450,height/350);for(const[a,b,l]of lines){ctx.strokeStyle=`rgb(255 255 255 / ${.18+l*.035})`;ctx.lineWidth=.65;ctx.beginPath();ctx.moveTo(width/2+a.x*s,height/2+a.y*s);ctx.lineTo(width/2+b.x*s,height/2+b.y*s);ctx.stroke();}}
    function frame(){if(!paused)time+=.012;draw();requestAnimationFrame(frame);}canvas.tabIndex=0;canvas.onclick=()=>paused=!paused;canvas.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();paused=!paused;}};resize();addEventListener("resize",resize);addEventListener("orientationchange",resize);frame();
  </script>
</body>
</html>
