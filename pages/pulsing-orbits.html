<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <title>Тройной резонанс</title>
  <style>
    :root { color-scheme:dark; background:#090909; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; background:#090909; }
    main { min-height:calc(100dvh - 64px); display:grid; place-items:center; padding:12px; overflow:hidden; }
    .canvas-frame { width:min(100%, 1100px); aspect-ratio:16 / 9; }
    canvas { display:block; width:100%; height:100%; background:#090909; touch-action:manipulation; }
  </style>
  <script src="../assets/toolbar.js" defer></script>
</head>
<body data-title="Тройной резонанс" data-back="../">
  <main>
    <div class="canvas-frame">
      <canvas id="sketch" aria-label="Анимированная композиция из пульсирующих орбит"></canvas>
    </div>
  </main>
  <script>
    const canvas = document.querySelector("#sketch");
    const ctx = canvas.getContext("2d", { alpha: false });
    const size = 400;
    let pixelRatio = 1;
    let viewWidth = size;
    let viewHeight = size;
    let sceneScale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let time = 0;
    let paused = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function setResolution() {
      const bounds = canvas.getBoundingClientRect();
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      viewWidth = Math.max(1, Math.round(bounds.width));
      viewHeight = Math.max(1, Math.round(bounds.height));
      sceneScale = Math.min(viewWidth / size, viewHeight / size);
      offsetX = (viewWidth - size * sceneScale) / 2;
      offsetY = (viewHeight - size * sceneScale) / 2;
      canvas.width = Math.round(viewWidth * pixelRatio);
      canvas.height = Math.round(viewHeight * pixelRatio);
    }

    function draw() {
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      ctx.fillStyle = "#090909";
      ctx.fillRect(0, 0, viewWidth, viewHeight);
      ctx.setTransform(pixelRatio * sceneScale, 0, 0, pixelRatio * sceneScale, pixelRatio * offsetX, pixelRatio * offsetY);
      ctx.fillStyle = "rgba(255, 255, 255, .376)";

      for (let i = 10000; i > 0; i--) {
        const m = (i % 3) * 4;
        const k = 9 * Math.cos(i / 81);
        const e = i / 461 - 11;
        const d = Math.hypot(k, e) ** 4 / 40000 + 1.5 + Math.sin(time / 2 + m) / 4;
        const q = 89 - e * Math.sin(k) + k * (4 + 2 * Math.sin(d * 9 + e / 9 - time));
        const c = d + Math.sin(time - d * 4) / 9 - time / 9 + m;
        const x = q * Math.cos(c) + 200;
        const y = (q + 30) * Math.sin(c) + 200;
        ctx.fillRect(x, y, 1, 1);
      }
    }

    function frame() {
      if (!paused) time += Math.PI / 60;
      draw();
      requestAnimationFrame(frame);
    }

    canvas.addEventListener("click", () => { paused = !paused; });
    canvas.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        paused = !paused;
      }
    });
    canvas.tabIndex = 0;
    canvas.setAttribute("aria-label", "Анимированная композиция из пульсирующих орбит. Нажмите, чтобы остановить или запустить.");
    setResolution();
    window.addEventListener("resize", setResolution);
    frame();
  </script>
</body>
</html>
