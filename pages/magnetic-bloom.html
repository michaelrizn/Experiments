<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Магнитный цветок</title>
  <style>
    :root { color-scheme:dark; background:#050505; } * { box-sizing:border-box; } html,body { min-height:100%; margin:0; background:#050505; }
    main { height:calc(100dvh - 64px); display:grid; place-items:center; padding:12px; overflow:hidden; } .canvas-frame { height:min(900px, calc(100dvh - 88px), calc((100vw - 24px) * 16 / 9)); aspect-ratio:9 / 16; } canvas { display:block; width:100%; height:100%; background:#050505; touch-action:manipulation; }
    @media (max-width:720px) { .toolbar + main { height:calc(100dvh - 64px - env(safe-area-inset-top)); } .canvas-frame { height:min(calc(100dvh - 88px - env(safe-area-inset-top)), calc((100vw - 24px) * 16 / 9)); } }
  </style>
  <script src="../assets/toolbar.js" defer></script>
</head>
<body data-title="Магнитный цветок" data-back="../">
  <main><div class="canvas-frame"><canvas id="sketch" aria-label="Анимированное магнитное поле"></canvas></div></main>
  <script>
    const canvas=document.querySelector("#sketch"),ctx=canvas.getContext("2d",{alpha:false});let ratio=1,width=360,height=640,time=0,paused=matchMedia("(prefers-reduced-motion: reduce)").matches;
    function resize(){const b=canvas.getBoundingClientRect();ratio=Math.min(devicePixelRatio||1,2);width=Math.max(1,Math.round(b.width));height=Math.max(1,Math.round(b.height));canvas.width=width*ratio;canvas.height=height*ratio;}
    function draw(){ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle="#050505";ctx.fillRect(0,0,width,height);const s=Math.min(width/360,height/640);ctx.translate(width/2,height/2);ctx.scale(s,s);ctx.lineCap="round";
      for(let strand=0;strand<64;strand++){const phase=strand/64*Math.PI*2;ctx.beginPath();for(let n=0;n<150;n++){const u=n/149*2-1,r=28+196*(1-u*u),a=phase+u*3.3+time*.65+Math.sin(u*5+time)*.18,x=Math.cos(a)*r*.68,y=u*292+Math.sin(a*2)*r*.13;if(!n)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.strokeStyle=`rgb(255 255 255 / ${.09+(strand%6)*.025})`;ctx.lineWidth=.55;ctx.stroke();}
      for(let i=0;i<260;i++){const a=i*2.399+time*.8,r=15+(i%29)*7.2,x=Math.cos(a)*r*.72,y=Math.sin(a*1.7)*r*1.15;ctx.fillStyle="rgb(255 255 255 / .65)";ctx.fillRect(x,y,1.1,1.1);}ctx.setTransform(ratio,0,0,ratio,0,0);}
    function frame(){if(!paused)time+=.009;draw();requestAnimationFrame(frame);}canvas.tabIndex=0;canvas.onclick=()=>paused=!paused;canvas.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();paused=!paused;}};resize();addEventListener("resize",resize);addEventListener("orientationchange",resize);frame();
  </script>
</body>
</html>
