<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Тестовая запись — Experiments</title>
  <style>
    :root { color-scheme: dark; --bg:#101010; --surface:#191919; --surface-2:#222; --line:#303030; --text:#f3f3f3; --muted:#a0a0a0; }
    * { box-sizing:border-box; }
    html, body { min-height:100%; background:var(--bg); }
    body { margin:0; color:var(--text); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .page { min-height:100vh; display:flex; flex-direction:column; }
    header { min-height:68px; display:flex; align-items:center; gap:12px; padding:0 28px; border-bottom:1px solid var(--line); background:var(--surface); }
    .back { width:36px; height:36px; display:grid; place-items:center; border:0; border-radius:50%; color:var(--text); background:transparent; text-decoration:none; font-size:24px; }
    .back:hover,.back:focus-visible { background:var(--surface-2); outline:none; }
    h1,p { margin:0; }
    header h1 { font-size:16px; line-height:1.25; }
    .status { color:var(--muted); font-size:13px; }
    main { flex:1; display:grid; place-items:center; padding:32px 24px; }
    article { width:min(680px,100%); padding:28px; border:1px solid var(--line); border-radius:16px; background:var(--surface); }
    .label { color:var(--muted); font-size:13px; margin-bottom:10px; }
    h2 { margin:0; font-size:clamp(28px,4vw,36px); line-height:1.15; letter-spacing:-.03em; }
    .description { max-width:52ch; margin-top:18px; color:#c8c8c8; }
    .meta { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:30px; padding-top:20px; border-top:1px solid var(--line); }
    .meta span { color:var(--muted); font-size:13px; }
    .meta strong { display:block; margin-top:3px; color:var(--text); font-size:14px; }
    @media (min-width:721px) { .back { display:none; } }
    @media (max-width:720px) { header { min-height:64px; padding:env(safe-area-inset-top) 12px 0; } main { padding:12px; align-items:start; } article { padding:22px; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="back" href="../" aria-label="Назад к списку">←</a>
      <div><h1>Тестовая запись</h1><p class="status">Объект № 001</p></div>
    </header>
    <main>
      <article>
        <p class="label">Объект № 001</p>
        <h2>Тестовая запись</h2>
        <p class="description">Это начальный экран объекта. На мобильном устройстве он открывается отдельной страницей, а на десктопе остаётся рядом со списком.</p>
        <div class="meta">
          <span>Статус<strong>Активен</strong></span>
          <span>Обновлено<strong>Сегодня</strong></span>
        </div>
      </article>
    </main>
  </div>
</body>
</html>
