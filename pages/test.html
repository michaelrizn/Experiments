<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Тестовая запись</title>
  <style>
    :root { color-scheme:dark; --bg:#101010; --text:#f4f4f4; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; background:var(--bg); }
    body { margin:0; color:var(--text); font:600 clamp(22px,4vw,34px)/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { min-height:100vh; display:grid; place-items:center; padding:24px; text-align:center; }
    h1 { margin:0; letter-spacing:-.03em; }
  </style>
</head>
<body>
  <main><h1>Тестовая запись</h1></main>
</body>
</html>
