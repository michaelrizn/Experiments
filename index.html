<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f3f3">
  <title>Experiments</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #eeeeee;
      --panel: #f8f8f8;
      --surface: #ffffff;
      --line: #dddddd;
      --ink: #202020;
      --muted: #737373;
      --active: #e3e3e3;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-width: 320px; min-height: 100vh;
      background: var(--canvas); color: var(--ink);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button { font: inherit; }
    .app {
      width: min(1180px, 100vw); min-height: 100vh; margin: 0 auto;
      display: grid; grid-template-columns: 360px minmax(0, 1fr);
      background: var(--surface); box-shadow: 0 0 32px rgb(0 0 0 / 5%);
    }
    .sidebar {
      min-height: 100vh; background: var(--panel); border-right: 1px solid var(--line);
      padding: 16px 12px;
    }
    .sidebar__top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 2px 8px 16px;
    }
    h1, h2, p { margin: 0; }
    .brand { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
    .icon-button {
      width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent;
      color: var(--ink); cursor: pointer; display: grid; place-items: center;
    }
    .icon-button:hover, .icon-button:focus-visible { background: var(--active); outline: none; }
    .search { position: relative; margin-bottom: 12px; }
    .search input {
      width: 100%; height: 42px; border: 1px solid transparent; border-radius: 10px;
      background: #e7e7e7; color: var(--ink); padding: 0 14px; font: inherit;
    }
    .search input:focus { outline: 2px solid #a9a9a9; outline-offset: 1px; background: var(--surface); }
    .record {
      width: 100%; border: 0; border-radius: 12px; padding: 12px; text-align: left;
      display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center;
      color: inherit; background: var(--active); cursor: pointer;
    }
    .record:hover, .record:focus-visible { background: #d9d9d9; outline: none; }
    .avatar {
      width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%;
      background: #bdbdbd; color: #fff; font-weight: 700; font-size: 16px;
    }
    .record__title { font-weight: 650; }
    .record__preview { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .record__time { align-self: start; color: var(--muted); font-size: 12px; padding-top: 2px; }
    .main { min-width: 0; min-height: 100vh; display: flex; flex-direction: column; background: #f5f5f5; }
    .main__header {
      height: 73px; flex: 0 0 73px; display: flex; align-items: center; gap: 14px;
      padding: 0 28px; border-bottom: 1px solid var(--line); background: var(--surface);
    }
    .back { display: none; }
    .main__header h2 { font-size: 16px; font-weight: 700; }
    .status { color: var(--muted); font-size: 13px; margin-top: 1px; }
    .object {
      width: min(680px, calc(100% - 48px)); margin: auto; background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--radius); padding: 28px;
    }
    .object__label { margin-bottom: 8px; color: var(--muted); font-size: 13px; }
    .object__title { font-size: clamp(25px, 4vw, 34px); line-height: 1.15; letter-spacing: -.03em; }
    .object__text { max-width: 52ch; margin-top: 16px; color: #555; }
    .object__meta {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 28px;
      padding-top: 20px; border-top: 1px solid var(--line);
    }
    .meta-item { color: var(--muted); font-size: 13px; }
    .meta-item strong { display: block; color: var(--ink); font-size: 14px; font-weight: 600; margin-top: 2px; }
    @media (max-width: 720px) {
      .app { display: block; }
      .sidebar { min-height: 100vh; border: 0; padding: 16px 12px; }
      .main { display: none; min-height: 100vh; }
      .app[data-view="detail"] .sidebar { display: none; }
      .app[data-view="detail"] .main { display: flex; }
      .main__header { padding: 0 12px; }
      .back { display: grid; margin-left: -6px; }
      .object { width: calc(100% - 24px); padding: 22px; margin: 12px auto auto; }
    }
  </style>
</head>
<body>
  <main class="app" data-view="list">
    <aside class="sidebar" aria-label="Список объектов">
      <div class="sidebar__top">
        <h1 class="brand">Experiments</h1>
        <button class="icon-button" type="button" aria-label="Создать объект" title="Создать объект">+</button>
      </div>
      <form class="search" role="search">
        <input type="search" aria-label="Поиск по объектам" placeholder="Поиск">
      </form>
      <button class="record" type="button" aria-current="page" id="open-detail">
        <span class="avatar" aria-hidden="true">Т</span>
        <span>
          <span class="record__title">Тестовая запись</span>
          <span class="record__preview">Откройте, чтобы посмотреть объект</span>
        </span>
        <time class="record__time" datetime="2026-08-01">сегодня</time>
      </button>
    </aside>

    <section class="main" aria-labelledby="object-title">
      <header class="main__header">
        <button class="icon-button back" type="button" id="back-to-list" aria-label="Назад к списку">←</button>
        <div>
          <h2>Тестовая запись</h2>
          <p class="status">Один объект</p>
        </div>
      </header>
      <article class="object">
        <p class="object__label">Объект № 001</p>
        <h2 class="object__title" id="object-title">Тестовая запись</h2>
        <p class="object__text">Это начальный экран объекта. На мобильном устройстве он открывается отдельной страницей, а на десктопе остаётся рядом со списком.</p>
        <div class="object__meta">
          <div class="meta-item">Статус<strong>Активен</strong></div>
          <div class="meta-item">Обновлено<strong>Сегодня</strong></div>
        </div>
      </article>
    </section>
  </main>
  <script>
    const app = document.querySelector(".app");
    document.querySelector("#open-detail").addEventListener("click", () => {
      app.dataset.view = "detail";
      history.pushState({ view: "detail" }, "", "#test");
    });
    document.querySelector("#back-to-list").addEventListener("click", () => history.back());
    window.addEventListener("popstate", () => { app.dataset.view = "list"; });
    if (location.hash === "#test") app.dataset.view = "detail";
  </script>
</body>
</html>
