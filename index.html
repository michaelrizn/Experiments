<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Experiments</title>
  <style>
    :root { color-scheme:dark; --bg:#101010; --panel:#161616; --row:#1d1d1d; --hover:#262626; --line:#303030; --text:#f4f4f4; --muted:#929292; --focus:#d5d5d5; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; background:var(--bg); }
    body { margin:0; color:var(--text); font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .app { min-height:100vh; max-width:1180px; margin:auto; display:grid; grid-template-columns:360px minmax(0,1fr); background:var(--bg); box-shadow:0 0 40px rgb(0 0 0 / .28); }
    nav { min-height:100vh; padding:12px; overflow-y:auto; border-right:1px solid var(--line); background:var(--panel); }
    .search { width:100%; height:42px; margin:0 0 12px; padding:0 14px; border:1px solid transparent; border-radius:10px; color:var(--text); background:#242424; font:inherit; }
    .search::placeholder { color:var(--muted); }
    .search:focus { border-color:#777; outline:2px solid var(--focus); outline-offset:1px; }
    .pages { display:grid; gap:4px; }
    .page-link, summary { display:block; padding:14px 16px; border-radius:10px; color:var(--text); text-decoration:none; background:var(--row); font-weight:600; }
    .page-link:hover,.page-link:focus-visible,summary:hover,summary:focus-visible { background:var(--hover); outline:none; }
    .page-link:focus-visible,summary:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
    details { border-radius:10px; background:#181818; }
    summary { cursor:pointer; list-style:none; }
    summary::-webkit-details-marker { display:none; }
    summary::after { content:"⌄"; float:right; color:var(--muted); transition:transform .16s ease; }
    details:not([open]) summary::after { transform:rotate(-90deg); }
    .group-pages { display:grid; gap:4px; padding:4px 0 0 12px; }
    .empty { display:none; margin:16px 4px; color:var(--muted); text-align:center; }
    .main { min-width:0; min-height:100vh; background:var(--bg); }
    iframe { width:100%; height:100vh; display:block; border:0; background:var(--bg); }
    @media (max-width:720px) { .app { display:block; } nav { min-height:100vh; padding:calc(12px + env(safe-area-inset-top)) 12px 24px; border:0; } .main { display:none; } }
  </style>
</head>
<body>
  <main class="app">
    <nav aria-label="Страницы экспериментов">
      <input class="search" id="search" type="search" autocomplete="off" aria-label="Поиск по страницам" placeholder="Поиск">
      <div class="pages">
        <a class="page-link" href="pages/test.html">Тестовая запись</a>
        <details class="group" open data-name="p5.js">
          <summary>p5.js</summary>
          <div class="group-pages">
            <a class="page-link" href="pages/kinetic-form.html">Волновая хризантема</a>
            <a class="page-link" href="pages/pulsing-orbits.html">Тройной резонанс</a>
            <a class="page-link" href="pages/flowing-globe.html">Текучая сфера</a>
            <a class="page-link" href="pages/tesseract.html">Тессеракт</a>
            <a class="page-link" href="pages/penteract.html">Пентеракт</a>
            <a class="page-link" href="pages/tidal-dome.html">Приливный купол</a>
            <a class="page-link" href="pages/tangential-dome.html">Тангенциальный купол</a>
            <a class="page-link" href="pages/infinity-knot.html">Узел бесконечности</a>
            <a class="page-link" href="pages/vortex-threads.html">Вихревые нити</a>
            <a class="page-link" href="pages/prismatic-core.html">Призматическое ядро</a>
            <a class="page-link" href="pages/surface-ripples.html">Круги на поверхности</a>
          </div>
        </details>
      </div>
      <p class="empty" id="empty">Ничего не найдено</p>
    </nav>
    <section class="main" aria-label="Выбранная страница">
      <iframe id="detail" src="pages/test.html" title="Тестовая запись"></iframe>
    </section>
  </main>
  <script>
    const search = document.querySelector("#search");
    const links = [...document.querySelectorAll(".page-link")];
    const groups = [...document.querySelectorAll(".group")];
    const empty = document.querySelector("#empty");
    const detail = document.querySelector("#detail");

    search.addEventListener("input", () => {
      const query = search.value.trim().toLocaleLowerCase("ru");
      let count = 0;
      links.forEach((link) => {
        const visible = link.textContent.toLocaleLowerCase("ru").includes(query);
        link.hidden = !visible;
        count += Number(visible);
      });
      groups.forEach((group) => {
        const hasVisiblePages = [...group.querySelectorAll(".page-link")].some((link) => !link.hidden);
        const groupMatches = group.dataset.name.includes(query);
        group.hidden = !hasVisiblePages && !groupMatches;
        if (query && !group.hidden) group.open = true;
      });
      empty.style.display = count ? "none" : "block";
    });

    links.forEach((link) => link.addEventListener("click", (event) => {
      if (window.matchMedia("(min-width: 721px)").matches) {
        event.preventDefault();
        detail.src = link.href;
        detail.title = link.textContent;
      }
    }));
  </script>
</body>
</html>
